    });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
    }

    function prettyName(name) {
      return String(name||'')
        .replace(/\.(html?|xhtml)$/i,'')
        .replace(/([a-z0-9])([A-Z])/g,'$1 $2')
        .replace(/([A-Za-z])(\d)/g,'$1 $2')
        .replace(/(\d)([A-Za-z])/g,'$1 $2')
        .replace(/[_-]+/g,' ')
        .replace(/\s+/g,' ')
        .trim();
    }

    function normalizeDriveLink(value) {
      if(!value) return null;
      const s = String(value).trim();
      const direct = s.match(/^https?:\/\/drive\.google\.com\/uc\?export=download&id=([^&#]+)/i);
      if(direct) return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(direct[1])}`;
      const id1 = s.match(/\/file\/d\/([^/]+)/i);
      if(id1) return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id1[1])}`;
      const id2 = s.match(/[?&]id=([^&#]+)/i);
      if(id2) return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id2[1])}`;
      if(/^[A-Za-z0-9_-]{20,}$/.test(s)) return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(s)}`;
      return null;
    }

    function normalizeNewGames(data) {
      const rows = Array.isArray(data) ? data : (Array.isArray(data?.games) ? data.games : []);
      return rows.map((g, index) => {
        const name = prettyName(g?.name ?? g?.title ?? `New Game ${index+1}`);
        const source = g?.link ?? g?.url ?? g?.driveLink ?? g?.shareLink ?? g?.id ?? '';
        const direct = normalizeDriveLink(source);
        if(!direct) return null;
        return {name, direct};
      }).filter(Boolean);
    }

    function render() {
      const q = search.value.toLowerCase().trim();
      const oldMatches = files.filter(f => {
        const display = prettyName(f.name);
        return !q || display.toLowerCase().replace(/[^a-z0-9]/g,'').includes(q.replace(/[^a-z0-9]/g,''));
      });
      const newMatches = newFiles.filter(f => {
        return !q || f.name.toLowerCase().replace(/[^a-z0-9]/g,'').includes(q.replace(/[^a-z0-9]/g,''));
      });

      newSection.style.display = newMatches.length ? 'block' : 'none';
      newBadge.textContent = `${newMatches.length} new`;
      newList.innerHTML = newMatches.length
        ? newMatches.map(f => `<div class="item"><div class="name" title="${esc(f.name)}">${esc(f.name)}</div><a class="btn" href="${esc(f.direct)}">Download</a></div>`).join('')
        : '';

      count.textContent = oldMatches.length + ' file' + (oldMatches.length === 1 ? '' : 's');

      list.innerHTML = oldMatches.map(f => {
        const display = prettyName(f.name);
        return `<div class="item"><div class="name" title="${esc(display)}">${esc(display)}</div><a class="btn" href="https://drive.google.com/uc?export=download&id=${encodeURIComponent(f.id)}">Download</a></div>`;
      }).join('') || '<div style="padding:25px;text-align:center;color:#777">No files found.</div>';
    }

    async function loadNewGames(silent = false) {
      if (updateInProgress) return;
      updateInProgress = true;

      if (!silent) {
        updateStatus.textContent = 'Checking for new games...';
        updateStatus.style.color = '#bbb';
      }
      if (updateButton) updateButton.textContent = 'Updating...';

      try {
        const url = UPDATE_URL + (UPDATE_URL.includes('?') ? '&' : '?') + '_=' + Date.now();
        const response = await fetch(url, { method: 'GET', cache: 'no-store' });
        
        if (response.status === 403 || response.status === 429) throw new Error('REQUEST_LIMIT');
        if (!response.ok) throw new Error(`HTTP_${response.status}`);

        const raw = await response.text();
        let data;
        try { data = JSON.parse(raw); } 
        catch(_) { throw new Error('INVALID_JSON'); }

        const parsed = normalizeNewGames(data);
        newFiles = parsed;
        render();

        updateStatus.textContent = parsed.length
          ? `${parsed.length} new game${parsed.length === 1 ? '' : 's'} loaded.`
          : 'No new games right now.';
        updateStatus.style.color = parsed.length ? '#72d572' : '#aaa';

      } catch (error) {
        if (error.message === 'REQUEST_LIMIT') {
          updateStatus.textContent = 'Request limit reached. Try Update List again later.';
          updateStatus.style.color = '#ffd166';
        } else if (error.message === 'INVALID_JSON') {
          updateStatus.textContent = 'The update list could not be read. Existing games are still available.';
          updateStatus.style.color = '#ffb3b3';
        } else {
          updateStatus.textContent = 'Could not check for new games. Existing games are still available.';
          updateStatus.style.color = '#ffb3b3';
        }
        console.warn('Game update check failed:', error);
        render();
      } finally {
        updateInProgress = false;
        if (updateButton) updateButton.textContent = 'Update List';
      }
    }

    if (updateButton) {
      updateButton.addEventListener('click', () => loadNewGames(false));
    }

    search.addEventListener('input', render);
    render();
    loadNewGames();
    setInterval(() => loadNewGames(true), 15 * 60 * 1000);
  </script>
</body>
</html>
